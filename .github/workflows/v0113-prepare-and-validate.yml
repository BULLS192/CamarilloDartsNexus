name: V0.11.3 Prepare and Validate
on:
  push:
    branches: [fix/v0113-bullshooter-window-reliability]
    paths: [.github/workflows/v0113-prepare-and-validate.yml]
permissions:
  contents: write
jobs:
  prepare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update V0.11.3 deployment contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deploy/patch-v1001-unified-player-metrics.mjs')
          s=p.read_text()
          s=s.replace('0.11.2','0.11.3')
          s=s.replace("test=test.replaceAll('0.11.0','0.11.3')", "test=test.replaceAll('0.11.0','0.11.3').replaceAll('0.11.2','0.11.3')")
          s=s.replace("'node tests/player-render-v112.test.js']", "'node tests/player-render-v112.test.js','node tests/bullshooter-window-v113.test.js']")
          p.write_text(s)

          d=Path('Dockerfile')
          x=d.read_text()
          x=x.replace('tests/player-render-v112.test.js /app/tests/','tests/player-render-v112.test.js tests/bullshooter-window-v113.test.js /app/tests/')
          x=x.replace('V0.10.1-V0.11.2:','V0.10.1-V0.11.3:')
          d.write_text(x)
          PY
      - name: Commit deployment contract changes
        shell: bash
        run: |
          git config user.name "BULLS192"
          git config user.email "kevinbullsyap@gmail.com"
          git add deploy/patch-v1001-unified-player-metrics.mjs Dockerfile
          git commit -m "V0.11.3 deployment contract" || true
          git push
      - name: Build exact Render Docker image
        run: docker build --progress=plain -t camarillo-v0113 .
