name: NEXUS League Engine V1.2.x

on:
  push:
    branches: ["feature/v121-league-builder", "feature/v122-teams-schedule"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate League Engine
        run: npm run test:league
      - name: Validate League Browser Modules
        run: node --check public/league-builder.js && node --check public/league-operations.js
      - name: Run Full Repository Checks
        run: npm run check
