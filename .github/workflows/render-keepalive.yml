name: Manual Camarillo Darts Render Health Check

# Supabase pg_cron job 1 already calls the Render /health endpoint every five
# minutes. Keep this workflow as an on-demand fallback rather than also
# scheduling GitHub Actions runs against the same endpoint.
on:
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render service health
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 5 --max-time 60 \
            https://camarillo-darts.onrender.com/health
