name: Validate Camarillo Darts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check src/tournament.js
      - run: node --check public/v080t.js
      - run: node --check deploy/patch-v080t.mjs
      - run: npm install
      - run: npm run check
