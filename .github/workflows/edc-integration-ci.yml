name: Multi-source Integration CI

on:
  push:
    branches:
      - 'v0.9.*'
  pull_request:
    paths:
      - 'src/edc.js'
      - 'deploy/patch-v090-edc.mjs'
      - 'tests/edc.test.js'
      - 'public/v092-stats.js'
      - 'public/v092-stats.css'
      - 'deploy/patch-v092-stats.mjs'
      - 'tests/stats-sources-ui.test.js'
      - 'Dockerfile'
      - '.github/workflows/edc-integration-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate stats sources UI contract
        run: node tests/stats-sources-ui.test.js
      - name: Probe Render service hostname from render.yaml
        shell: bash
        run: |
          set +e
          for host in camarillo-darts.onrender.com camarillo-darts-nexus.onrender.com camarillodarts.onrender.com; do
            echo "######## ${host} ########"
            for path in / /health /api/players /api/players/robustness /v0918-table.js; do
              code=$(curl --connect-timeout 15 --max-time 45 -sS -o /tmp/probe.body -w '%{http_code}' "https://${host}${path}")
              rc=$?
              echo "=== ${path} | curl_rc=${rc} http_status=${code} ==="
              head -c 900 /tmp/probe.body 2>/dev/null || true
              echo
            done
          done
          exit 0
      - name: Build deployment image and run all checks
        run: docker build --progress=plain -t camarillo-darts-multisource-ci .
