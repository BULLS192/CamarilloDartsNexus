name: Multi-source Integration CI

on:
  push:
    branches:
      - 'v0.9.*'
  pull_request:
    paths:
      - 'src/edc.js'
      - 'deploy/patch-v090-edc.mjs'
      - 'tests/edc.test.js'
      - 'public/v092-stats.js'
      - 'public/v092-stats.css'
      - 'deploy/patch-v092-stats.mjs'
      - 'tests/stats-sources-ui.test.js'
      - 'Dockerfile'
      - '.github/workflows/edc-integration-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate stats sources UI contract
        run: node tests/stats-sources-ui.test.js
      - name: Probe live Render robustness endpoint
        shell: bash
        run: |
          set +e
          code=$(curl --connect-timeout 15 --max-time 45 -sS -o /tmp/robustness.json -w '%{http_code}' https://cd-nexus.onrender.com/api/players/robustness)
          curl_rc=$?
          echo "curl_rc=$curl_rc http_status=$code"
          echo '--- live body ---'
          cat /tmp/robustness.json 2>/dev/null || true
          echo
          echo '--- parsed contract ---'
          node - <<'NODE'
          const fs=require('fs');
          let raw='';try{raw=fs.readFileSync('/tmp/robustness.json','utf8')}catch{}
          console.log('bytes=',raw.length);
          try{
            const d=JSON.parse(raw);
            console.log('type=',Array.isArray(d)?'array':typeof d,'keys=',d&&typeof d==='object'?Object.keys(d):[]);
            console.log('count=',d?.count,'indexed=',d?.byBullshooterId?Object.keys(d.byBullshooterId).length:null);
            console.log('kevin192985=',JSON.stringify(d?.byBullshooterId?.['192985']??null));
          }catch(e){console.log('parse_error=',e.message)}
          NODE
          exit 0
      - name: Build deployment image and run all checks
        run: docker build --progress=plain -t camarillo-darts-multisource-ci .
