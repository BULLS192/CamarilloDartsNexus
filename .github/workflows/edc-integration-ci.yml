name: EDC Integration CI

on:
  push:
    branches:
      - v0.9-edc-integration
  pull_request:
    paths:
      - 'src/edc.js'
      - 'deploy/patch-v090-edc.mjs'
      - 'tests/edc.test.js'
      - 'Dockerfile'
      - '.github/workflows/edc-integration-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build deployment image and run all checks
        run: docker build --progress=plain -t camarillo-darts-edc-integration-ci .
