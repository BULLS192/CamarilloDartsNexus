name: V0.11.3 Contract Tests and Validate
on:
  push:
    branches: [fix/v0113-bullshooter-window-reliability]
    paths: [.github/workflows/v0113-fix-tests-and-validate.yml]
permissions:
  contents: write
jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align all source contract tests to V0.11.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('tests').glob('*.test.js'):
              s=p.read_text()
              s=s.replace('0.11.2','0.11.3').replace('V0.11.2','V0.11.3')
              s=s.replace(r'0\.11\.2',r'0\.11\.3')
              p.write_text(s)
          PY
      - name: Commit test contract updates
        shell: bash
        run: |
          git config user.name "BULLS192"
          git config user.email "kevinbullsyap@gmail.com"
          git add tests
          git commit -m "Normalize V0.11.3 test cache assertions" || true
          git push
      - name: Build exact Render Docker image
        run: docker build --progress=plain -t camarillo-v0113 .
