services:
  - type: web
    name: camarillo-darts
    runtime: docker
    plan: free
    region: ohio
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://lgefivcocbjrjpfzwfmy.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_L9GxbR8iPPRta8AResUJ1w_919i_EOf
      - key: CAMARILLO_STATE_TOKEN
        sync: false
      - key: EDC_BACKGROUND_SYNC_MS
        value: "600000"
      - key: TOC_BACKGROUND_SYNC_MS
        value: "86400000"
      - key: TOC_BACKGROUND_CHECK_MS
        value: "60000"
      - key: TOC_IDLE_BEFORE_SYNC_MS
        value: "60000"
      - key: TOC_PAGE_DELAY_MS
        value: "250"
      - key: TOC_DURABLE_CHECKPOINT_EVERY
        value: "100"
      - key: TOC_LEASE_RENEW_MS
        value: "60000"
      - key: TOC_ATOMIC_LEASE_SECONDS
        value: "120"
